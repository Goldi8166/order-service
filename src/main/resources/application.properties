# ---------- App ----------
quarkus.application.name=order-service

# ---------- Datasource (PostgreSQL) ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:orders_user}
quarkus.datasource.password=${DB_PASSWORD:orders_pass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
quarkus.hibernate-orm.database.generation=update

# ---------- REST Client Reactive: exchange rate API ----------
quarkus.rest-client.exchange-rate-api.url=${EXCHANGE_RATE_API_URL:https://open.er-api.com}
quarkus.rest-client.exchange-rate-api.connect-timeout=3000
quarkus.rest-client.exchange-rate-api.read-timeout=3000

# ---------- Kafka ----------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing channel: OrderService publishes ORDER_CREATED events here
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-created-events
mp.messaging.outgoing.order-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Incoming channel: OrderEventConsumer listens on the same topic
mp.messaging.incoming.order-events-in.connector=smallrye-kafka
mp.messaging.incoming.order-events-in.topic=order-created-events
mp.messaging.incoming.order-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.group.id=order-service-indexer
mp.messaging.incoming.order-events-in.auto.offset.reset=earliest

# Tests use an in-memory connector instead of a real Kafka broker,
# so `mvn test` doesn't need Kafka running. Postgres must still be reachable
# (start it with: docker-compose up -d postgres).
%test.mp.messaging.outgoing.order-events.connector=smallrye-in-memory
%test.mp.messaging.incoming.order-events-in.connector=smallrye-in-memory

# ---------- OpenSearch ----------
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# ---------- HTTP ----------
quarkus.http.port=8080

# ---------- Logging ----------
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG

# ---------- OpenAPI / Swagger UI ----------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
